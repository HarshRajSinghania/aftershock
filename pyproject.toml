[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aftershock"
version = "0.1.0"
description = "Finds the exact lines a library, API or config change breaks in other code — verified, with file:line, never a risk score."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Apoorv Bankey" }]
keywords = ["breaking-changes", "api-compatibility", "static-analysis", "code-review", "griffe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = ["griffe>=1.0"]

[project.urls]
Homepage = "https://github.com/apoorv1997/aftershock"
Issues = "https://github.com/apoorv1997/aftershock/issues"
Changelog = "https://github.com/apoorv1997/aftershock/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest"]
model = ["typesafe-sdk"]         # model judgement for spans the rules cannot decide; without it they go to review
explain = ["anthropic"]          # only for --explain-backend anthropic; template and ollama backends need nothing

[project.scripts]
aftershock = "aftershock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aftershock"]

[tool.hatch.build.targets.sdist]
include = ["aftershock/", "tests/", "spike/*.py", "spike/CALIBRATION.md", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]
